cv.onpointermove=e=>{if(joy){const dx=e.clientX-joy.sx,dy=e.clientY-joy.sy,d=Math.hypot(dx,dy);joy.dx=d>10?dx/Math.max(d,40):0;joy.dy=d>10?dy/Math.max(d,40):0}};
onpointerup=()=>joy=null;
reset();let lt=performance.now();
(function loop(n){const dt=Math.min(.05,(n-lt)/1000);lt=n;fl=Math.max(0,fl-dt*2);if(hs>0)hs-=dt;else if(st=='play')upd(dt);draw();requestAnimationFrame(loop)})(lt);
</script></body></html>
